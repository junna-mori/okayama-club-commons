/* ===== Magic sparkles intro (WIZARDS' smile magic) ===== */
.magic-intro {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(244,196,77,0.08) 0%, rgba(24,32,83,0.92) 70%);
  animation: magic-fade 3s ease forwards;
}
.magic-intro.done {
  animation: magic-fade-out 0.8s ease forwards;
}
.magic-intro-text {
  position: relative;
  z-index: 2;
  color: #F4C44D;
  font-size: clamp(1.4rem, 4vw, 2.6rem);
  font-weight: 700;
  text-align: center;
  letter-spacing: 0.05em;
  line-height: 1.5;
  text-shadow: 0 0 24px rgba(244,196,77,0.6), 0 0 48px rgba(244,196,77,0.3);
  animation: magic-text-in 1.2s cubic-bezier(0.22,1,0.36,1) both, magic-text-glow 3s ease-in-out infinite alternate;
}
.magic-sparkle {
  position: absolute;
  left: var(--x);

const normalize = value => String(value).normalize('NFKC').toLocaleLowerCase().trim();
function filterClubs(items, { query = '', category = 'all', beginner = false, savedOnly = false, saved = [] } = {}) {
  const q = normalize(query);
  return items.filter(item => (category === 'all' || item.category === category)
    && (!beginner || item.beginner) && (!savedOnly || saved.includes(item.id))
    && (!q || normalize([item.name.en, item.name.ja, item.subtitle.en, item.subtitle.ja, item.summary.en, item.summary.ja].join(' ')).includes(q)));
}
function filterRestaurants(items, { area = 'all', diet = 'all' } = {}) {
  return items.filter(item => (area === 'all' || item.area === area)
    && (diet === 'all' || (diet === 'unconfirmed' ? item.diets.length === 0 : item.diets.includes(diet))));
}

    <section class="wrap pathways" aria-label="${t('Explore the guide','ガイドの入口')}">${[['01','clubs','Find something you love','好きな活動に出会う','Sports, music, culture & more.','スポーツも、音楽も、文化も。'],['02','dining','Make room at the table','同じ食卓を囲む','Food that makes space for differences.','食のちがいを知り、一緒に楽しむ。'],['03','guide','Take the first step','最初の一歩を踏み出す','A little help before you say hello.','見学の相談から、受け入れの準備まで。']].map(([n,path,en,ja,suben,subja])=>`<a href="#/${path}"><span class="step-no">${n}</span><div><h2>${t(en,ja)}</h2><p>${t(suben,subja)}</p></div>${arrow()}</a>`).join('')}</section>
    <section class="section wrap"><div class="section-heading"><div>${label('YOUR NEXT CHAPTER','あなたの、新しい居場所。')}<h2>${t('There’s more than one way to belong.','居場所のかたちは、ひとつじゃない。')}</h2></div><a class="text-link" href="#/clubs">${t('Explore all 8 clubs','8つの部活動を見る')}${arrow()}</a></div><div class="club-grid">${clubs.slice(0,3).map(clubCard).join('')}</div><p class="fine-print">${t('*Beginner information comes from public club introductions. International student eligibility, language support and visiting arrangements must be confirmed with each club.','*初心者については公開された団体紹介に基づきます。留学生の参加条件、言語のサポート、見学方法は各団体へ確認してください。')}</p></section>
    <section class="dining-feature"><div class="wrap dining-feature-grid"><div>${label('BEYOND THE PRACTICE','練習が終わった、そのあとも。')}<h2>${t('Good conversations<br>start with<br><em>“Shall we eat?”</em>','「ごはん、行こう」から<br><em>広がるつながり。</em>')}</h2></div><div class="dining-feature-copy"><span class="large-line-icon">${icon('bowl')}</span><p>${t('Vegan, halal, or simply something new. Learn what matters to each other, then find a meal you can enjoy together.','ビーガン、ハラール、初めて食べる国の料理。お互いが大切にしていることを知って、一緒に楽しめる食事を探しませんか。')}</p><div class="diet-words"><span>Vegan</span><span>Halal</span><span>${t('Food cultures','食文化')}</span></div>${buttonLink('dining',t('Explore food & places','食文化とお店を知る'))}<p class="fine-print light">${t('Tsushima campus & selected places in central Okayama.','津島キャンパス周辺と、岡山市中心部の候補を紹介。')}</p></div></div></section>
    <section class="section wrap story-preview"><div>${label('IT STARTED WITH A TEAM','ひとつのチームから、始まった。')}<h2>${t('A new teammate.<br>A wider world.','新しい仲間が、<br>世界を広げてくれた。')}</h2></div><div><p class="lead">${t('When an international student joined WIZARDS, the change went beyond cheerleading. New perspectives, new friendships, and the confidence to connect across cultures.','WIZARDSに留学生を迎えて生まれたのは、技術面の刺激だけではありませんでした。新しい仲間とのつながり、そして自分たちも国際交流ができるという自信でした。')}</p><p>${t('This guide grows from that experience: making it easier to meet, participate and keep sharing time together.','その経験を、ほかの部活動にも。出会い、参加し、その後も交流を深めていけるきっかけをつくりたいと考えています。')}</p><a class="text-link" href="#/about">${t('Read the story behind this guide','この取り組みの背景を読む')}${arrow()}</a></div></section>
    <section class="wrap start-banner"><div><p class="eyebrow">${t('NO PERFECT JAPANESE REQUIRED TO SAY HELLO','最初の「こんにちは」を、少し気軽に。')}</p><h2>${t('Not sure how to reach out?','連絡のしかたに、迷ったら。')}</h2><p>${t('Prepare a simple message in English and Japanese.','日英の見学相談メッセージを用意できます。')}</p></div>${buttonLink('guide',t('Prepare your first message','相談メッセージをつくる'))}</section>`;
}
function pageHead(kicker, title, intro, cls = '') {
  return `<section class="page-head ${cls}"><div class="wrap">${label(kicker[0], kicker[1])}<h1>${t(title[0],title[1])}</h1><p>${t(intro[0],intro[1])}</p></div></section>`;
}
function clubsPage() {
  return `${pageHead(['FIND YOUR PEOPLE','あなたの仲間を、見つけよう。'],['A shared interest.<br>A new beginning.','共通の「好き」が、<br>新しい出会いになる。'],['Explore a first selection of clubs. Your experience, your interests, your pace.','まずは8つの部活動から。経験も、興味も、あなたのペースで。'])}<section class="wrap section directory"><div class="directory-toolbar"><label class="search-field">${icon('search')}<span class="sr-only">${t('Search clubs in English or Japanese','英語・日本語で部活動を検索')}</span><input id="club-search" type="search" value="${esc(filters.query)}" placeholder="${t('Search clubs, interests…','部活動名や興味のあることを検索…')}" autocomplete="off"></label><button class="filter-toggle" id="saved-filter" aria-pressed="${filters.savedOnly}">${icon('bookmark')}${t('Saved','保存済み')} <span id="saved-count">${saved.length}</span></button></div><div class="filter-row" role="group" aria-label="${t('Club categories','部活動のカテゴリー')}">${Object.entries(categories).map(([key,[en,ja]])=>`<button data-category="${key}" class="chip" aria-pressed="${filters.category === key}">${t(en,ja)}</button>`).join('')}</div><div class="results-heading"><p id="club-count" role="status" aria-live="polite"></p><label class="checkbox-label"><input type="checkbox" id="beginner-filter" ${filters.beginner ? 'checked' : ''}>${t('Beginner welcome mentioned','初心者歓迎の記載がある団体')}</label></div><div class="club-grid" id="club-results"></div><p class="fine-print">${t('This is a curated starting point, not a complete club directory. Beginner information is not a guarantee of international student admission. Contact each club about eligibility, language support, fees and insurance.','全団体を網羅した一覧ではなく、活動を探すための入口です。初心者歓迎の記載は留学生の入部を保証するものではありません。参加条件、言語、費用、保険は各団体へ相談してください。')}</p><div class="resource-strip"><div><h2>${t('Still exploring?','ほかの活動も、探してみよう。')}</h2><p>${t('See the full university directory, or prepare your first message.','大学の公式一覧も確認しながら、見学の相談をしてみましょう。')}</p></div>${ext(sources.clubs,t('Full official directory','公式の部活動一覧'))}<a class="text-link" href="#/guide">${t('Prepare a message','見学相談文をつくる')}${arrow()}</a></div></section>`;
}
function updateClubs() {
  const matches = filterClubs(clubs, { ...filters, saved, savedOnly: filters.savedOnly });
  $('#club-count').textContent = t(`${matches.length} ${matches.length === 1 ? 'club' : 'clubs'} to explore`, `${matches.length}件の部活動`);

}
const dietLabel = diet => ({vegan: t('Vegan option listed','ビーガン料理の記載あり'), halal: t('Halal products listed','ハラール商品の記載あり'), unconfirmed: t('Dietary options unconfirmed','食事対応は未確認')})[diet];
function restaurantCard(r) {

}
function cultureSection() {
  return `<section class="culture-section section" id="food-culture"><div class="wrap"><div class="section-heading"><div>${label('UNDERSTANDING BEFORE CHOOSING','お店を決める、その前に。')}<h2>${t('Ask the person.<br>Not the stereotype.','「きっとこう」より、<br>「どうしたい？」を。')}</h2></div><p class="section-aside">${t('Food choices are personal. Religion, culture, values and health can all matter. The best starting point is a considerate question.','食事の選び方には、宗教や文化、価値観、体質などさまざまな背景があります。本人の希望を聞くことから始めましょう。')}</p></div><div class="culture-grid"><article><span class="culture-number">01</span><h3>Vegan <span>／ ${t('Plant-based choices','ビーガン')}</span></h3><p>${t('Vegan meals avoid animal-derived ingredients. Ask about broth, dairy, eggs, honey and gelatin as well as meat and fish. A vegetable dish may still use fish broth.','肉や魚だけでなく、卵、乳製品、はちみつ、ゼラチン、動物性のだしなども確認します。野菜料理でも魚のだしが入っていることがあります。')}</p></article><article><span class="culture-number">02</span><h3>Halal <span>／ ${t('Individual requirements','ハラール')}</span></h3><p>${t('Pork, meat sourcing, alcohol in seasonings and shared preparation may matter. Requirements vary by person. Vegan does not automatically mean halal.','豚由来の成分、肉の調達、調味料のアルコール、調理器具の共用なども確認の対象です。大切にする条件は一人ひとり異なります。ビーガン料理が必ずハラールとは限りません。')}</p></article><article><span class="culture-number">03</span><h3>${t('A shared plan','一緒につくる食事の予定')}</h3><p>${t('Ask privately, agree on a budget and check the menu together. Leave room to decline. Allergies are a separate question: a dietary label does not guarantee allergen safety.','希望は個別に聞き、予算やメニューを一緒に確認しましょう。断る選択肢も大切に。アレルギーは別に確認し、食事のラベルだけで安全と判断しないようにしましょう。')}</p></article></div><p class="fine-print">${t('Background reference: Okayama tourism hospitality guidance. Preferences always need individual confirmation.','参考：岡山県の食の多様性に関するおもてなし資料。実際の希望は必ず本人に確認してください。')} ${ext(sources.foodCulture,t('Read the guidance','資料を見る'))}</p><div class="phrase-section"><div>${label('WORDS THAT HELP','伝えるための、小さな道具。')}<h2>${t('A few words.<br>A more welcoming table.','ひとことから、<br>囲みやすい食卓へ。')}</h2><p>${t('Copy a phrase, adapt it, and share it yourself.','文章をコピーして、自分の希望に合わせて伝えてください。')}</p></div><div>${Object.entries(dietaryPhrases).map(([key,phrase])=>`<details class="phrase-card" ${key === 'together' ? 'open' : ''}><summary>${{vegan:t('Explain a vegan request','ビーガンの希望を伝える'),halal:t('Ask about halal options','ハラール対応を相談する'),together:t('Invite everyone into the plan','みんなでお店を選ぶ')}[key]}</summary><p lang="en">${esc(phrase.en)}</p><p lang="ja">${esc(phrase.ja)}</p><div class="button-row"><button class="small-button" data-phrase="${key}" data-copy-lang="en">${icon('copy')} Copy English</button><button class="small-button" data-phrase="${key}" data-copy-lang="ja">${icon('copy')} 日本語をコピー</button></div></details>`).join('')}</div></div></div></section>`;
}
function diningPage() {
  return `${pageHead(['A PLACE AT THE TABLE','一緒に食べる時間を、もっと。'],['Different tastes.<br>One shared table.','食のちがいを越えて、<br>一緒に「おいしい」を。'],['Find a meal, learn about food cultures, and keep the conversation going after club activities.','お店を探し、食文化を知る。部活動のあとにも、交流が続くきっかけを。'])}<section class="wrap section dining-directory"><div class="dining-intro"><p>${t('Start close to campus, or plan a trip into the city. These are places to contact, not a guarantee that a particular meal meets your needs.','キャンパスの近くから、市中心部へのお出かけまで。掲載先は相談先の候補です。個々の料理への対応を保証するものではありません。')}</p><a class="text-link" href="#/dining?section=culture">${t('Understand food cultures','食文化を知る')}${arrow()}</a></div><div class="dining-controls"><label>${t('Where','エリア')}<select id="area-filter"><option value="all">${t('All areas','すべてのエリア')}</option><option value="tsushima">${t('Tsushima & campus','津島周辺・学内')}</option><option value="city">${t('Central Okayama','岡山市中心部')}</option></select></label><label>${t('Publicly listed options','公開情報での食事対応')}<select id="diet-filter"><option value="all">${t('All places','すべての候補')}</option><option value="vegan">${t('Vegan option listed','ビーガン料理の記載あり')}</option><option value="halal">${t('Halal products / catering listed','ハラール商品・ケータリングの記載あり')}</option><option value="unconfirmed">${t('Dietary options unconfirmed','食事対応は未確認')}</option></select></label><p id="dining-count" role="status" aria-live="polite"></p></div><div class="restaurant-list" id="restaurant-results"></div><div class="resource-strip"><div><h2>${t('Check together before you go.','行く前に、一緒に確認。')}</h2><p>${t('Ingredients, kitchen arrangements, opening dates and group seating can change. No restaurant has been contacted by this project.','原材料や調理方法、営業日、席の状況は変わります。この制作では店舗への直接確認は行っていません。')}</p></div>${ext(sources.foodGuide,t('Okayama City food guide','岡山市のフードガイド'))}</div></section>${cultureSection()}`;
}

ssage','文章をコピー')}</button></div></form></section>`;
}
function studentGuide() {

    ['Find a point of curiosity','気になる活動を見つける','You do not have to decide to join yet. Read a few club introductions and save the ones you want to ask about.','まだ入部を決めなくても大丈夫。紹介を読んで、気になる団体を保存してみましょう。'],
    ['Ask before you visit','見学前に、相談する','Share your study period, experience and language level. Ask about observation, membership eligibility and any practical support.','在籍期間、経験、言語のレベルを伝え、見学や入部の条件、必要なサポートを相談します。'],
    ['Agree on the practical details','参加に必要なことを確認する','Confirm the schedule, meeting point, fees, insurance, equipment and safety explanations before taking part. These differ by club and student status.','日時・集合場所・費用・保険・用具・安全の説明を確認してから参加しましょう。必要事項は団体や在籍区分で異なります。'],

}
function hostGuide() {
  const groups = [
    ['Before saying yes','受け入れを相談するとき','Ask about the student’s interests, study period, language and experience. Check eligibility with the relevant university office if needed; do not make assumptions from nationality.','本人の興味、在籍期間、言語、経験を聞きます。必要に応じて大学の担当窓口へ参加条件を確認し、国籍で決めつけないようにしましょう。'],
    ['Make the practical things visible','必要な情報を、見える形に','Prepare clear information about fees, insurance, equipment, attendance expectations, emergency contacts and safety. Use written notes and demonstrations alongside spoken explanations.','費用、保険、用具、参加頻度、緊急時の連絡、安全について整理します。口頭説明に加え、短い文章や実演も使いましょう。'],
    ['Make space for questions','聞きやすい関係をつくる','Agree on a contact person and a comfortable way to ask questions. Check understanding without putting anyone on the spot, and avoid assigning all translation to one teammate.','相談しやすい担当者や連絡方法を決めます。人前で試すようにせず理解を確認し、翻訳の負担が特定の部員だけに偏らないようにしましょう。'],
    ['Include the time after practice','練習のあとの時間も、大切に','Ask about food preferences privately and plan together. Make eating out and social events optional; review what is working after the first few activities.','食の希望は個別に聞き、一緒に計画します。外食や交流行事は任意とし、参加が始まってからも困りごとを確認しましょう。']
  ];
  return `<div class="guide-layout"><aside><p class="eyebrow">${t('FOR CLUB MEMBERS','部活動のメンバーへ')}</p><h2>${t('A welcome becomes<br>a shared practice.','「歓迎したい」を、<br>日々の行動に。')}</h2><p>${t('A conversation guide inspired by the WIZARDS experience. Adapt it with your club and university; this is not an official policy.','WIZARDSの経験をきっかけにまとめた、話しあいのヒントです。大学の公式規程ではありません。各団体や大学と相談して活用してください。')}</p></aside><div class="host-checklist">${groups.map(([en,ja,descEn,descJa],i)=>`<article><span class="culture-number">0${i+1}</span><h3>${t(en,ja)}</h3><p>${t(descEn,descJa)}</p></article>`).join('')}</div></div><div class="resource-strip"><div><h2>${t('Keep learning from one another.','受け入れたあとも、学びあおう。')}</h2><p>${t('The aim is participation that feels comfortable for the student and the team. Revisit the plan together.','本人にもチームにも無理のない参加を目指して、やり方を一緒に見直しましょう。')}</p></div><a class="text-link" href="#/dining?section=culture">${t('Explore food cultures','食文化を知る')}${arrow()}</a></div>`;
}
function guidePage() {
  const faq = [
    ['Can every international student join every club?','留学生なら、どの部活動にも入れますか？','Participation depends on the club and your student status or study period. The university’s English guidance says short-term students need the club’s approval for KOUYUKAI clubs. Confirm your own situation directly.','参加条件は団体、在籍区分、在籍期間などによって異なります。大学の英語案内では、短期留学生の校友会クラブへの参加には団体の承認が必要とされています。自分の条件を直接確認してください。'],
    ['Do I need to speak fluent Japanese?','日本語が流暢でなくても大丈夫ですか？','Language support varies. Tell the club how you prefer to communicate and ask how activity and safety instructions are explained. This guide does not certify that a club can operate in English.','対応できる言語は団体によって異なります。使いやすい言語を伝え、活動や安全の説明をどのように行うか相談してください。このサイトは各団体の英語対応を保証していません。'],
    ['Are fees or insurance required?','費用や保険は必要ですか？','Requirements differ. Ask the club and relevant university office about membership fees, equipment, insurance and coverage before participating. This guide does not set fees or interpret insurance terms.','必要事項はそれぞれ異なります。入部費・部費・用具代・保険加入・補償範囲は、参加前に団体や大学の担当窓口へ確認してください。このサイトでは費用や保険の条件を定めていません。'],
    ['Does this site send my inquiry?','ここから見学の申し込みはできますか？','No. The message tool creates a draft you can copy. Please send it yourself through the club’s official contact channel. No registration or message submission is available here.','このサイトでは申し込みを送信しません。作成した文章をコピーして、各団体の公式窓口からご自身で連絡してください。会員登録や問い合わせ送信の機能はありません。']
  ];
  return `${pageHead(['A LITTLE HELP TO BEGIN','一歩目を、少し踏み出しやすく。'],['Your first hello<br>can open a door.','最初の「こんにちは」が、<br>出会いのきっかけに。'],['For students exploring a club, and teams ready to welcome someone new.','部活動を探す学生にも、新しい仲間を迎えたいチームにも。'])}<section class="wrap section"><div class="guide-tabs" role="tablist" aria-label="${t('Guide audience','ガイドの対象')}"><button id="tab-students" role="tab" data-guide="students" aria-controls="guide-panel" aria-selected="${guideTab==='students'}" tabindex="${guideTab==='students' ? 0 : -1}">${t('I’d like to join','参加したい方へ')}</button><button id="tab-hosts" role="tab" data-guide="hosts" aria-controls="guide-panel" aria-selected="${guideTab==='hosts'}" tabindex="${guideTab==='hosts' ? 0 : -1}">${t('We’d like to welcome','迎えたい部活動へ')}</button></div><div id="guide-panel" role="tabpanel" aria-labelledby="tab-${guideTab}">${guideTab === 'students' ? studentGuide() : hostGuide()}</div><section class="faq"><div>${label('A FEW COMMON QUESTIONS','気になることを、ひとつずつ。')}<h2>${t('Before you get started.','参加の前に、知っておきたいこと。')}</h2></div><div>${faq.map(([en,ja,de,dj])=>`<details><summary>${t(en,ja)}</summary><p>${t(de,dj)}</p></details>`).join('')}<p class="fine-print">${t('Participation reference:','参加条件の参考：')} ${ext(sources.joining,t('Okayama University club guidance','岡山大学の部活動案内'))}</p></div></section></section>`;
}
function aboutPage() {
  return `${pageHead(['WHY THIS GUIDE EXISTS','この取り組みが、目指すこと。'],['A club can make<br>a campus feel like home.','部活動から、<br>キャンパスをもっと身近に。'],['It began with an international student joining a cheerleading team.','ひとりの留学生が、チアリーディング部の仲間になったことから。'])}<section class="wrap section about-story"><div class="story-title">${label('THE WIZARDS EXPERIENCE','WIZARDSでの経験から。')}<h2>${t('One team.<br>Many ways to grow.','ひとつのチームに、<br>新しい可能性。')}</h2></div><div class="story-text"><p class="lead">${t('Welcoming an international student brought WIZARDS new perspectives on technique, a new teammate, and the confidence that everyday club life can be a place for international exchange.','留学生を迎えたWIZARDSには、技術への新しい刺激、国籍や言語を越えた仲間、そして日々の部活動でも国際交流ができるという自信が生まれました。')}</p><p>${t('There were practical questions too. How do we explain activities and safety? How do we find a restaurant where a vegan teammate and everyone else can eat together?','一方で、活動や安全のルールをどう伝えるか、ビーガンの仲間と一緒に食べられるお店をどう探すかなど、実際に参加して初めて見えてくる課題もありました。')}</p><p>${t('This guide connects these two needs: helping students discover clubs, and helping teammates understand one another after they join. It is a starting point for conversations, not a promise that every question is already solved.','このガイドは、部活動への興味を持つ入口と、入部したあとにもお互いの文化を理解しあう機会をつなぎます。すべての答えを用意するのではなく、話しあいを始めるきっかけになることを目指しています。')}</p><p class="source-note">${t('Adapted from the project proposal supplied for this site. Personal names and reference-deck photographs are not published here.','このサイトの企画資料をもとに要約しています。個人名や資料内の写真は掲載していません。')}</p></div></section><section class="mission-band"><div class="wrap"><p>${t('OUR HOPE','この取り組みに込める思い')}</p><h2>${t('More chances to meet.<br>More reasons to stay connected.','出会うきっかけを増やし、<br>つながりが続くキャンパスへ。')}</h2></div></section><section class="wrap section"><div class="about-principles"><article><span>01</span><h3>${t('Make activities discoverable','活動を、見つけやすく。')}</h3><p>${t('Clear introductions in two languages, with links back to official information.','日英の読みやすい紹介と、公式情報へたどれる入口をつくります。')}</p></article><article><span>02</span><h3>${t('Make differences discussable','ちがいを、話しやすく。')}</h3><p>${t('Food culture pages and useful phrases help students ask instead of assume.','食文化の紹介と伝えるための文章で、決めつけずに相談するきっかけをつくります。')}</p></article><article><span>03</span><h3>${t('Make connection last','交流を、その先にも。')}</h3><p>${t('A shared meal and a small check-in can become part of everyday team life.','一緒に囲む食卓や、ふだんの声かけを通して、参加後の交流も大切にします。')}</p></article></div><div class="editorial-note"><h2>${t('About the information in this guide','掲載情報について')}</h2><p>${t('COMMONS is an independent student-led website concept. It is not operated or endorsed by Okayama University, its clubs or the listed venues. English club names and summaries are editorial translations of public information.','COMMONSは学生発の自主制作サイトです。岡山大学、掲載団体、店舗が運営・承認しているサイトではありません。部活動の英語名や紹介文は、公開情報をもとにした編集上の翻訳・要約です。')}</p><p>${t('Public sources were reviewed on 12 November 2026. Clubs and venues have not been interviewed or visited for verification. Please check current conditions with the official source.','公開情報は2026年11月12日に確認しました。制作時に団体・店舗への取材や現地確認は行っていません。最新の条件は公式情報や各窓口で確認してください。')}</p><p>${t('The campus, club and food images are AI-generated illustrations of fictional scenes. They do not depict the actual club members, campus, venues or dishes. Dietary suitability is based on the linked information, never on an image.','キャンパス・部活動・料理の画像は、架空の場面を描いたAI生成イメージです。実際の部員、キャンパス、店舗、提供料理の写真ではありません。食事の対応は画像から判断せず、掲載情報と各店舗で確認してください。')}</p></div><section class="sources-section"><h2>${t('Sources & useful links','出典・役立つリンク')}</h2><div class="source-links">${ext(sources.clubs,t('Okayama University official club directory','岡山大学校友会・公認クラブ一覧'))}${ext(sources.joining,t('University guidance for club participation','岡山大学・留学生向け部活動案内'))}${ext(sources.foodGuide,t('Okayama City food & drinks guide','岡山市のフード＆ドリンクガイド'))}${ext(sources.foodCulture,t('Food diversity hospitality guidance','食の多様性へのおもてなし資料'))}${ext(sources.lcafe,t('Okayama University L-café','岡山大学L-café'))}</div><p class="fine-print">${t('Each club and dining entry also links to its own source.','各部活動・食事候補にも、それぞれの出典を掲載しています。')}</p></section><section class="privacy-section"><h2>${t('Your browser, your saved list.','保存した情報について')}</h2><p>${t('This site uses local storage only for your display language and saved club IDs. It has no account system, contact submission, analytics or advertising trackers. Message drafts are not stored. Your hosting provider and any external website you choose to visit may process access information under their own policies.','このサイトは表示言語と保存した部活動のIDだけをブラウザ内に記録します。アカウント、問い合わせ送信、アクセス解析、広告トラッカーはありません。相談文の入力内容は保存しません。公開先のホスティング事業者や、リンクから訪問する外部サイトでは、それぞれの方針に従ってアクセス情報が処理される場合があります。')}</p><button class="small-button" id="clear-saved">${t('Clear saved clubs','保存した部活動をすべて解除')}</button></section></section>`;
}
function render({ focus = false } = {}) {
  const path = location.hash.replace(/^#\/?/, '').split('?')[0];
  route = ['home','clubs','dining','guide','about'].includes(path) ? path : (path ? 'not-found' : 'home');
  document.documentElement.lang = lang;
  const titles = {home:t('Home','ホーム'),clubs:t('Find a club','部活動を探す'),dining:t('Eat together','一緒に食べる'),guide:t('Getting started','参加のガイド'),about:t('Our story','この取り組み'), 'not-found':t('Page not found','ページが見つかりません')};
  document.title = `${titles[route]} | ${t('Welcome to Okayama University','岡山大学へようこそ')}`;
  header(); footer();
  $('#main').innerHTML = ({ home, clubs: clubsPage, dining: diningPage, guide: guidePage, about: aboutPage }[route] || (()=>`<section class="wrap section empty-state"><h1>404</h1><p>${titles['not-found']}</p>${buttonLink('home',t('Back to home','ホームへ'))}</section>`))();
  if (route === 'clubs') updateClubs();
  if (route === 'dining') { $('#area-filter').value = diningFilters.area; $('#diet-filter').value = diningFilters.diet; updateDining(); }
  if (focus) { $('#main').focus({ preventScroll: true }); window.scrollTo({ top: 0, behavior: 'instant' }); }
  if (route === 'dining' && location.hash.includes('section=culture')) requestAnimationFrame(()=>$('#food-culture').scrollIntoView({behavior:'instant'}));
}
function announce(message) { clearTimeout(toastTimer); $('#toast').textContent = message; $('#toast').classList.add('visible'); toastTimer = setTimeout(()=>$('#toast').classList.remove('visible'), 3500); }
async function copyText(text, fallbackElement) {
  try {
    if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
    await navigator.clipboard.writeText(text);
    announce(t('Copied. Review it before sharing.','コピーしました。内容を確認してからご利用ください。'));
  } catch {
    // Visible, selectable fallback works even when the Clipboard API is blocked.
    const output = fallbackElement || $('#copy-fallback');
    if (output) { output.value = text; output.hidden = false; output.focus(); output.select(); }
    else {
      const dialog = $('#club-dialog');
      previousFocus = document.activeElement;
      dialog.innerHTML = `<div class="dialog-top"><h2 id="dialog-title">${t('Copy this text','文章をコピー')}</h2><button class="icon-button" data-close aria-label="${t('Close','閉じる')}">${icon('close')}</button></div><p>${t('Automatic copy is unavailable. Select and copy the text below.','自動コピーが使えません。下の文章を選択してコピーしてください。')}</p><textarea id="copy-fallback" rows="10" readonly aria-label="${t('Text to copy','コピーする文章')}"></textarea>`;
      dialog.showModal(); $('#copy-fallback').value = text; $('#copy-fallback').focus(); $('#copy-fallback').select();
    }
    announce(t('Select the text and copy it manually.','選択された文章を手動でコピーしてください。'));
  }
}
function showClub(id) {
  const c = clubs.find(c=>c.id===id); if (!c) return;
  previousFocus = document.activeElement;
  const dialog = $('#club-dialog');
  const imageBlock = c.image
    ? `<figure class="dialog-image"><img src="${esc(c.image)}" alt="${esc(local(c.imageAlt))}" width="1200" height="800" decoding="async"><figcaption>${t('Official club photo','公式写真')}</figcaption></figure>`
    : `<figure class="dialog-image no-image"><span class="no-image-label">${t('No photo on the official page','公式ページに写真の掲載なし')}</span></figure>`;
  dialog.innerHTML = `<div class="dialog-top"><span class="eyebrow">${t(...categories[c.category])}</span><button class="icon-button" data-close aria-label="${t('Close details','詳細を閉じる')}">${icon('close')}</button></div>${imageBlock}<p class="card-subtitle">${esc(local(c.subtitle))}</p><h2 id="dialog-title">${esc(local(c.name))}</h2><p class="lead">${esc(local(c.detail))}</p><dl class="club-facts"><div><dt>${t('Published schedule','公開されている活動日')}</dt><dd>${esc(local(c.schedule))}</dd></div><div><dt>${t('Activity location','活動場所')}</dt><dd>${esc(local(c.location))}</dd></div><div><dt>${t('International student participation','留学生の参加')}</dt><dd>${t('Discuss directly with the club. Eligibility and language support have not been confirmed by this guide.','各団体へ直接ご相談ください。このサイトでは参加条件や言語のサポートを確認していません。')}</dd></div></dl><div class="conversation-note"><h3>${t('A good question to start with','最初に相談したいこと')}</h3><p>${esc(local(c.questions))}</p></div><div class="button-row">${ext(c.source,t('Official club introduction','公式の団体紹介'),'button')}<button class="button secondary" data-message-club="${c.id}">${t('Prepare an inquiry','相談文をつくる')}${arrow()}</button></div><p class="fine-print">${sourceDate()}<br>${t('Japanese text is quoted from the official club page; English is our translation. Check the latest details with the club.','日本語は公式ページの原文をそのまま掲載しています。英語は当サイトの翻訳です。最新の情報は団体へ確認してください。')}</p>`;
  dialog.showModal();
}
function closeDialog() { $('#club-dialog').close(); }
$('#club-dialog').addEventListener('close',()=>{ if (previousFocus?.isConnected) previousFocus.focus(); });
$('#club-dialog').addEventListener('click',event=>{ if (event.target === $('#club-dialog')) { const r = event.target.getBoundingClientRect(); if (event.clientX<r.left || event.clientX>r.right || event.clientY<r.top || event.clientY>r.bottom) closeDialog(); } });

document.addEventListener('click', async event => {
  const target = event.target.closest('button,a'); if (!target) return;
  if (target.classList.contains('skip-link')) { event.preventDefault(); $('#main').focus(); return; }
  if (target.closest('#main-nav')) { $('#main-nav').classList.remove('open'); $('#menu-toggle').setAttribute('aria-expanded','false'); $('#menu-toggle').setAttribute('aria-label',t('Open navigation','メニューを開く')); }
  if (target.dataset.lang) {
    lang = target.dataset.lang; persist('commons-language',lang);
    const url = new URL(location.href); url.searchParams.set('lang',lang); try { history.replaceState(null,'',url); } catch { /* Some file:// preview environments restrict history changes. */ } render();
    document.querySelector(`[data-lang="${lang}"]`).focus();
  }
  if (target.id === 'menu-toggle') { const open = target.getAttribute('aria-expanded') !== 'true'; target.setAttribute('aria-expanded',String(open)); target.setAttribute('aria-label',open?t('Close navigation','メニューを閉じる'):t('Open navigation','メニューを開く')); $('#main-nav').classList.toggle('open',open); }
  if (target.dataset.category) { filters.category = target.dataset.category; document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===filters.category))); updateClubs(); }
  if (target.id === 'saved-filter') { filters.savedOnly = !filters.savedOnly; target.setAttribute('aria-pressed',String(filters.savedOnly)); updateClubs(); }
  if (target.dataset.save) {
    const id = target.dataset.save; if (!clubs.some(c=>c.id===id)) return;
    const wasSaved = saved.includes(id); saved = wasSaved ? saved.filter(x=>x!==id) : [...saved,id]; persist('commons-saved',saved);
    target.setAttribute('aria-pressed',String(!wasSaved)); target.classList.toggle('is-saved',!wasSaved);
    const club = clubs.find(c=>c.id===id); target.setAttribute('aria-label',t(`${wasSaved?'Save':'Unsave'} ${club.name.en}`,`${club.name.ja}の保存${wasSaved?'':'を解除'}`));
    if ($('#saved-count')) $('#saved-count').textContent = saved.length;
    if (route === 'clubs' && filters.savedOnly) { updateClubs(); $('#saved-filter').focus(); }
    announce(wasSaved?t('Removed from your saved clubs.','保存を解除しました。'):t('Saved in this browser.','このブラウザに保存しました。'));
  }
  if (target.dataset.club) showClub(target.dataset.club);
  if (target.hasAttribute('data-close')) closeDialog();
  if (target.dataset.messageClub) { const c = clubs.find(c=>c.id===target.dataset.messageClub); draft.club = c.name.ja; guideTab='students'; closeDialog(); if (route==='guide') render(); else location.hash='/guide'; requestAnimationFrame(()=>$('#message-builder')?.scrollIntoView({behavior:'instant'})); }
  if (target.id === 'reset-clubs') { Object.assign(filters,{ query:'',category:'all',beginner:false,savedOnly:false }); render(); $('#club-search').focus(); }
  if (target.id === 'reset-dining') { Object.assign(diningFilters,{area:'all',diet:'all'}); render(); $('#area-filter').focus(); }
  if (target.dataset.guide) { guideTab = target.dataset.guide; render(); $(`#tab-${guideTab}`).focus(); }
  if (target.dataset.messageLang) { document.querySelectorAll('[data-message-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b===target))); $('#message-output').value = buildClubMessage(draft)[target.dataset.messageLang]; $('#message-output').lang=target.dataset.messageLang; }
  if (target.id === 'copy-message') await copyText($('#message-output').value,$('#message-output'));
  if (target.dataset.phrase) await copyText(dietaryPhrases[target.dataset.phrase][target.dataset.copyLang]);
  if (target.id === 'clear-saved') { saved=[];persist('commons-saved',[]);announce(t('Saved clubs cleared.','保存した部活動を解除しました。')); }
});
document.addEventListener('input',event=>{
  if (event.target.id==='club-search') { filters.query=event.target.value;updateClubs(); }
  if (event.target.closest('#message-form') && event.target.name) { draft[event.target.name]=event.target.value; const ml = document.querySelector('[data-message-lang][aria-pressed="true"]').dataset.messageLang; $('#message-output').value=buildClubMessage(draft)[ml]; }
});
document.addEventListener('change',event=>{
  if (event.target.id==='beginner-filter') {filters.beginner=event.target.checked;updateClubs();}
  if (event.target.id==='area-filter') {diningFilters.area=event.target.value;updateDining();}
  if (event.target.id==='diet-filter') {diningFilters.diet=event.target.value;updateDining();}
});
document.addEventListener('submit',event=>{if(event.target.id==='message-form')event.preventDefault();});
document.addEventListener('keydown',event=>{
  if (event.key==='Escape' && $('#main-nav').classList.contains('open')) { $('#main-nav').classList.remove('open');$('#menu-toggle').setAttribute('aria-expanded','false');$('#menu-toggle').focus(); }
  if (event.target.matches('[role="tab"]') && ['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) {event.preventDefault();guideTab = event.key==='Home'?'students':event.key==='End'?'hosts':guideTab==='students'?'hosts':'students';render();$(`#tab-${guideTab}`).focus();}
});
window.addEventListener('hashchange',()=>render({focus:true}));
render();

</script>
  <script type="module">
  // Magic sparkles intro — "あなたの一歩を応援したい✨"
  // WIZARDS spreads smiles; this playful moment echoes that.
  (function () {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;
    const overlay = document.createElement('div');
    overlay.className = 'magic-intro';
    overlay.setAttribute('aria-hidden', 'true');
    overlay.innerHTML = '<span class="magic-intro-text">あなたの一歩を<br>応援したい ✨</span>';
    document.body.prepend(overlay);
    const sparkleCount = 48;
    const glyphs = ['✦', '✧', '⋆', '＋', '·'];
    for (let i = 0; i < sparkleCount; i++) {
      const s = document.createElement('span');
      s.className = 'magic-sparkle';
      s.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      const size = 10 + Math.random() * 22;
      s.style.setProperty('--s', size + 'px');
      s.style.setProperty('--x', (Math.random() * 100) + '%');
      s.style.setProperty('--y', (Math.random() * 100) + '%');
      s.style.setProperty('--d', (0.6 + Math.random() * 1.4) + 's');
      s.style.setProperty('--dl', (Math.random() * 0.5) + 's');
      s.style.setProperty('--r', (Math.random() * 360) + 'deg');
      s.style.setProperty('--o', (0.5 + Math.random() * 0.5));
      overlay.appendChild(s);
    }
    const sweep = document.createElement('span');
    sweep.className = 'magic-sweep';
    overlay.appendChild(sweep);
    setTimeout(() => { overlay.classList.add('done'); }, 2200);
    setTimeout(() => { overlay.remove(); }, 3000);
  })();
  </script>
